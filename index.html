<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多項式打地鼠</title>
<style>
:root{--bg:#f4f1e8;--card:#fff;--ink:#2a2a26;--mute:#6b6a62;--acc:#3f8f4f;--bad:#c0392b;--dirt:#8a6a45;--hole:#4a3623;--board:#fff8e1;--line:#d9d4c3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f1b;--card:#2a2d27;--ink:#ecebe3;--mute:#a3a296;--acc:#6cc27c;--bad:#ef6b5b;--dirt:#6b5238;--hole:#2b2016;--board:#3b3724;--line:#44473f}}
:root[data-theme="dark"]{--bg:#1d1f1b;--card:#2a2d27;--ink:#ecebe3;--mute:#a3a296;--acc:#6cc27c;--bad:#ef6b5b;--dirt:#6b5238;--hole:#2b2016;--board:#3b3724;--line:#44473f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.center{text-align:center}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.modes button {flex:1 1 30%; min-width:80px;}
.modes button.wide {flex:1 1 100%;}
button{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px;font-size:17px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sel{outline:3px solid var(--acc);outline-offset:2px}
.hud{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
#fill{height:100%;width:100%;background:var(--acc);transition:background .2s}
.q{font-size:clamp(18px,5vw,26px);text-align:center;font-weight:600;padding:12px 6px;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;margin-top:14px}
.hole{position:relative;height:118px;border:0;background:none;padding:0;cursor:pointer;overflow:hidden;border-radius:0 0 40px 40px}
.mound{position:absolute;left:4%;right:4%;bottom:0;height:34px;background:var(--dirt);border-radius:50%;z-index:3}
.pit{position:absolute;left:8%;right:8%;bottom:12px;height:26px;background:var(--hole);border-radius:50%;z-index:1}
.mole{position:absolute;left:50%;bottom:20px;width:92%;transform:translate(-50%,110%);transition:transform .22s ease-out;z-index:2;display:flex;flex-direction:column;align-items:center}
.hole.up .mole{transform:translate(-50%,0)}
.face{font-size:38px;line-height:1}
.sign{background:var(--board);border:2px solid var(--dirt);border-radius:8px;padding:3px 6px;font-size:clamp(13px,3.6vw,17px);font-weight:600;white-space:nowrap;margin-top:-2px}
.hole.ok .sign{border-color:var(--acc);background:var(--acc);color:#fff}
.hole.no .sign{border-color:var(--bad);background:var(--bad);color:#fff}
.hole.ok .mole,.hole.no .mole{animation:hit .25s}
@keyframes hit{50%{transform:translate(-50%,12%) scale(.95)}}
.msg{min-height:44px;text-align:center;margin-top:10px;font-size:15px;color:var(--mute)}
.msg b{color:var(--ink)}
.good{color:var(--acc)}.badc{color:var(--bad)}
.hearts{letter-spacing:2px}
.hide{display:none}
.rules{font-size:14px;color:var(--mute);line-height:1.7;text-align:left;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>🔨 多項式打地鼠</h1>

<div id="start" class="card center">
  <div class="rules">題目出現後，地鼠會舉著牌子冒出來。<br>只有一隻舉著<b>正確答案</b>，把它敲下去！<br>敲錯或超時會扣一顆愛心，答對越多題目越難。</div>
  <div class="modes" id="modes">
    <button class="btn alt" data-m="add">加法 ＋</button>
    <button class="btn alt" data-m="sub">減法 −</button>
    <button class="btn alt" data-m="mul">乘法 ×</button>
    <button class="btn alt" data-m="div">除法 ÷</button>
    <button class="btn alt sel wide" data-m="mix">全面混合模式 (＋−×÷)</button>
  </div>
  <button class="btn" id="go" style="width:100%">開始遊戲</button>
  <div class="rules center" id="best"></div>
</div>

<div id="play" class="card hide">
  <div class="hud"><span>分數 <b id="sc">0</b></span><span id="cb">連擊 0</span><span class="hearts" id="lv">❤❤❤</span></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="q" id="q"></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
</div>

<div id="over" class="card center hide">
  <h2 style="margin:6px 0">遊戲結束</h2>
  <p id="res" style="font-size:18px;line-height:1.7"></p>
  <button class="btn" id="again" style="width:100%">再玩一次</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const SUP=['','','²','³'];
let mode='mix',score=0,combo=0,lives=3,solved=0,locked=true,ans='',tLeft=0,tMax=10,timer=null,best=0,maxCombo=0;
try{best=+localStorage.getItem('polymole-best')||0}catch(e){}
function showBest(){$('best').textContent=best?'最高分：'+best:''}
showBest();

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function poly(deg){const p=[];for(let i=0;i<=deg;i++){let c=rnd(-9,9);if(i===deg&&c===0)c=rnd(1,5);p.push(c)}
  if(!p[deg])p[deg]=1;return p}
function fmt(p){let s='',first=true;
  for(let d=p.length-1;d>=0;d--){const c=p[d];if(!c)continue;const a=Math.abs(c);
    let t=d===0?String(a):(a===1?'':String(a))+'x'+SUP[d];
    if(first){s+=(c<0?'−':'')+t;first=false}else s+=(c<0?' − ':' + ')+t}
  return s||'0'}
function add(a,b,k=1){const n=Math.max(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push((a[i]||0)+k*(b[i]||0));return r}
function mul(a,b){const r=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return r}

function makeQ(){
  const lvl=Math.floor(solved/4);
  let op=mode==='mix'?['add','sub','mul','div'][rnd(0,3)]:mode;
  let a,b,res,sym,alt=[];
  
  if(op==='div'){
    // 反向產生除法：先決定商式(res)跟除式(b)，再乘起來當被除式(a)
    b=poly(1); 
    res=poly(lvl>=3&&Math.random()<.5?2:1);
    a=mul(res,b);
    sym='÷';
    // 錯誤選項：常數項錯、變號錯
    let w1=res.slice(); w1[0]+=rnd(1,3); alt.push(w1);
    let w2=res.slice(); w2[w2.length-1]*=-1; alt.push(w2);
  }else if(op==='mul'){
    a=poly(1);b=poly(lvl>=3&&Math.random()<.5?2:1);
    if(a.length+b.length>5)b=poly(1);
    res=mul(a,b);sym='×';alt.push(add(a,b))
    if(a.length===2&&b.length===2)alt.push([a[0]*b[0],0,a[1]*b[1]])
  }else{
    const d=lvl>=2?2:1;a=poly(d);b=poly(Math.random()<.5?d:1);
    if(op==='add'){res=add(a,b);sym='＋';alt.push(add(a,b,-1))}
    else{res=add(a,b,-1);sym='−';alt.push(add(a,b));
      const w=a.slice();w[b.length-1]-=b[b.length-1];for(let i=0;i<b.length-1;i++)w[i]+=b[i];alt.push(w)}
  }
  
  const right=fmt(res),set=new Set([right]),wrong=[];
  const tryAdd=p=>{const s=fmt(p);if(!set.has(s)&&wrong.length<3){set.add(s);wrong.push(s)}};
  alt.forEach(tryAdd);
  let guard=0;
  while(wrong.length<3&&guard++<80){
    const p=res.slice(),i=rnd(0,p.length-1),m=rnd(0,2);
    if(m===0)p[i]=-p[i]||rnd(1,4);else if(m===1)p[i]+=rnd(1,3)*(Math.random()<.5?-1:1);else p[i]+=(p[i]>0?-1:1)*rnd(1,9);
    if(!p[p.length-1])continue;tryAdd(p)
  }
  return{text:`(${fmt(a)}) ${sym} (${fmt(b)})`,right,opts:[right,...wrong]}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function hearts(){$('lv').textContent='❤'.repeat(lives)+'♡'.repeat(3-lives)}
function hud(){$('sc').textContent=score;$('cb').textContent='連擊 '+combo;hearts()}

function buildGrid(){
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<6;i++){const h=document.createElement('button');h.className='hole';
    h.innerHTML='<div class="pit"></div><div class="mole"><div class="face">🐹</div><div class="sign"></div></div><div class="mound"></div>';
    h.addEventListener('click',()=>whack(h));g.appendChild(h)}
}

function nextQ(){
  const q=makeQ();ans=q.right;$('q').textContent=q.text+' = ?';$('msg').innerHTML='';
  const holes=[...document.querySelectorAll('.hole')];
  holes.forEach(h=>{h.className='hole'});
  const slots=shuffle([0,1,2,3,4,5]).slice(0,4),opts=shuffle(q.opts.slice());
  slots.forEach((s,i)=>{holes[s].querySelector('.sign').textContent=opts[i];holes[s].dataset.v=opts[i];holes[s].dataset.on='1'});
  holes.forEach((h,i)=>{if(!slots.includes(i))delete h.dataset.on});
  setTimeout(()=>slots.forEach(s=>holes[s].classList.add('up')),150);
  tMax=Math.max(5,12-Math.floor(solved/4)*0.8);tLeft=tMax;locked=false;
  clearInterval(timer);
  timer=setInterval(()=>{tLeft-=0.05;const r=Math.max(0,tLeft/tMax);
    $('fill').style.width=r*100+'%';$('fill').style.background=r<.3?'var(--bad)':'var(--acc)';
    if(tLeft<=0){clearInterval(timer);miss('時間到！')}},50);
}

function reveal(){document.querySelectorAll('.hole').forEach(h=>{if(h.dataset.v===ans)h.classList.add('ok')})}

function whack(h){
  if(locked||!h.dataset.on)return;
  locked=true;clearInterval(timer);
  if(h.dataset.v===ans){
    combo++;maxCombo=Math.max(maxCombo,combo);solved++;
    const gain=10+Math.min(combo-1,10)*2+Math.round(tLeft);score+=gain;
    h.classList.add('ok');$('msg').innerHTML=`<span class="good"><b>答對了！</b> +${gain}</span>`;hud();
    setTimeout(nextQ,800);
  }else{
    h.classList.add('no');reveal();miss('敲錯了！',true);
  }
}
function miss(t,already){
  locked=true;combo=0;lives--;if(!already)reveal();hud();
  $('msg').innerHTML=`<span class="badc"><b>${t}</b></span> 正確答案是 <b>${ans}</b>`;
  if(lives<=0)setTimeout(end,1800);else setTimeout(nextQ,1800);
}
function end(){
  $('play').classList.add('hide');$('over').classList.remove('hide');
  const nb=score>best;if(nb){best=score;try{localStorage.setItem('polymole-best',best)}catch(e){}}
  $('res').innerHTML=`得分 <b>${score}</b>${nb?' 🎉 新紀錄！':''}<br>答對 ${solved} 題 · 最高連擊 ${maxCombo}`;
  showBest();
}
function start(){
  score=0;combo=0;lives=3;solved=0;maxCombo=0;hud();
  $('start').classList.add('hide');$('over').classList.add('hide');$('play').classList.remove('hide');
  buildGrid();nextQ();
}
$('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;[...$('modes').children].forEach(x=>x.classList.toggle('sel',x===b))});
$('go').onclick=start;
$('again').onclick=()=>{$('over').classList.add('hide');$('start').classList.remove('hide')};
</script>
</body>
</html>
